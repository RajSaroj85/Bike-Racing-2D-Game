<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bike Racing 3D</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="game">
      <div id="hud">
        <div class="speed-box">
          <span id="speed">0</span>
          <small>KM/H</small>
        </div>
        <div id="status">READY TO RIDE</div>
      </div>

      <div id="controls">
        <button id="leftBtn">◀</button>
        <button id="hornBtn">📢 HORN</button>
        <button id="rightBtn">▶</button>
        <button id="brakeBtn">BRAKE</button>
        <button id="gasBtn">ACCELERATE</button>
        <button id="lightBtn">💡 LIGHT</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
